<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 吾萌百科</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #fafafa;
  color: #333;
  min-height: 100vh;
}
#archive-banner {
  background: #f5f5f5;
  color: #555;
  padding: 8px 20px;
  text-align: center;
  font-size: 13px;
  line-height: 1.4;
  border-bottom: 1px solid #e0e0e0;
}
#archive-banner .archive-close {
  float: right;
  cursor: pointer;
  opacity: 0.5;
  font-size: 16px;
  line-height: 1;
}
.content {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 38px);
}
.wrap {
  text-align: center;
  padding: 40px 20px;
}
.code {
  font-size: 96px;
  font-weight: 700;
  color: #1a1a1a;
  letter-spacing: -2px;
  line-height: 1;
  margin-bottom: 16px;
}
.title {
  font-size: 20px;
  font-weight: 500;
  color: #1a1a1a;
  margin-bottom: 8px;
}
.desc {
  font-size: 14px;
  color: #888;
  line-height: 1.6;
  margin-bottom: 32px;
}
.notice {
  display: inline-block;
  font-size: 12px;
  color: #999;
  border: 1px solid #e0e0e0;
  padding: 4px 12px;
  border-radius: 3px;
  margin-bottom: 28px;
}
.links a {
  display: block;
  font-size: 14px;
  color: #1a1a1a;
  text-decoration: none;
  border-bottom: 1px solid #1a1a1a;
  padding-bottom: 2px;
  margin: 12px auto;
  width: fit-content;
}
.links a:hover {
  color: #666;
  border-bottom-color: #999;
}
</style>
</head>
<body>
<div id="archive-banner">
  本站已转为静态存档，内容不再更新，编辑与用户功能已禁用
  <span class="archive-close" onclick="document.getElementById('archive-banner').style.display='none';localStorage.setItem('archive_banner_closed','1');">&times;</span>
</div>
<div class="content">
  <div class="wrap">
    <div class="notice">本站已转为静态存档</div>
    <div class="code">404</div>
    <h1 class="title">页面不存在</h1>
    <p class="desc">你访问的页面可能已被移除或归档。<br>存档站点仅保留内容浏览功能。</p>
    <div class="links">
      <a href="/">返回首页</a>
      <a href="javascript:history.back()">返回上一页</a>
    </div>
  </div>
</div>
<script>if(localStorage.getItem('archive_banner_closed')==='1'){document.getElementById('archive-banner').style.display='none';}</script>
</body>
</html>
